<style>

  --paper:#e8e3d5;

  --plum-soft:#ece1e9;
  --slate:#5a6472;
  --slate-soft:#e6e8ec;

    --indigo:#7d9dce;
    --indigo-soft:#232c3c;
    --vermilion:#e58a68;
    --vermilion-soft:#3a2822;

  --line:#33384280; --indigo:#7d9dce; --indigo-soft:#232c3c; --vermilion:#e58a68; --vermilion-soft:#3a2822;

  --ink:#202436; --ink-soft:#5b5f72; --paper:#e8e3d5; --paper-raised:#f5f1e6; --card:#ffffff;
  --line:#d8d2c0; --indigo:#33507c; --indigo-soft:#e4eaf3; --vermilion:#bb4a2c; --vermilion-soft:#f7e6df;

*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-ui); -webkit-font-smoothing:antialiased;
  padding-bottom: calc(28px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
.app{max-width:560px; margin:0 auto; min-height:100vh; position:relative;}

/* header */
header.top{
  position:sticky; top:0; z-index:20; background:var(--paper);
  padding:14px 16px 0; border-bottom:1px solid var(--line);
  backdrop-filter: blur(6px);
}
.title-row{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
h1{font-size:19px; margin:0; font-weight:800; letter-spacing:-.01em;}
.subline{font-size:11.5px; color:var(--ink-soft); margin-top:2px; font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.now-pill{

  font-family:var(--font-mono);
}
.header-actions{display:flex; align-items:center; gap:6px; flex:0 0 auto;}
.fs-btn{

  background:var(--paper-raised); color:var(--ink-soft); font-size:13px; cursor:pointer;

}

  font-family:var(--font-ui); font-size:13px; font-weight:700; padding:7px 13px; border-radius:99px;
  cursor:pointer; transition:.15s;
}
nav.tabs button.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
nav.tabs button:focus-visible{ outline:2px solid var(--indigo); outline-offset:2px; }

main{padding:14px 16px 8px; max-width:100%; overflow-x:hidden;}
.panel{display:none;}
.panel.active{display:block; animation:fade .18s ease;}
@keyframes fade{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;}}

/* day theme header */
.day-hero{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:16px; box-shadow:var(--shadow);
}
.day-hero .badge{
  display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.04em;
  padding:3px 8px; border-radius:99px; margin-bottom:6px;
}
.badge.done{background:var(--moss-soft); color:var(--moss);}
.badge.wip{background:var(--gold-soft); color:var(--gold);}
.day-hero h2{margin:0 0 4px; font-size:17px; font-weight:800;}
.day-hero p{margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
.day-hero .foods{margin-top:8px; font-size:12px; color:var(--ink); font-weight:600;}
.day-hero-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.progress-wrap{margin-top:10px;}
.progress-track{height:5px; border-radius:99px; background:var(--line); overflow:hidden;}
.progress-fill{height:100%; background:var(--moss); border-radius:99px; transition:width .25s ease;}
.progress-text{margin-top:5px; font-size:11px; color:var(--ink-soft); font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
.reset-btn{
  flex:0 0 auto; border:1px solid var(--line); background:transparent; color:var(--ink-soft);
  font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:99px; cursor:pointer;
}
.reset-btn:active{background:var(--line);}

/* timeline (compact day view) */
.timeline{position:relative; padding-left:26px;}
.timeline::before{
  content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px;
  background:linear-gradient(var(--line), var(--line));
}
.stop{position:relative; margin-bottom:10px;}
.stop::before{
  content:""; position:absolute; left:-26px; top:16px; width:10px; height:10px; border-radius:50%;
  background:var(--card); border:2px solid var(--ink-soft); z-index:1;
}
.stop.cat-교통::before, .stop.cat-이동::before{border-color:var(--slate);}
.stop.cat-식사::before, .stop.cat-야식::before{border-color:var(--vermilion);}
.stop.cat-관광::before, .stop.cat-야경::before{border-color:var(--moss);}
.stop.cat-쇼핑::before, .stop.cat-오락::before, .stop.cat-시장::before{border-color:var(--indigo);}
.stop.cat-카페::before, .stop.cat-휴식::before, .stop.cat-숙소::before{border-color:var(--gold);}
.stop.next::before{
  background:var(--vermilion); border-color:var(--vermilion);
  box-shadow:0 0 0 4px var(--vermilion-soft);
}
.stop.done::before{ background:var(--moss); border-color:var(--moss); }

.card{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow); overflow:hidden; transition:box-shadow .15s, opacity .2s;
}
.stop.next .card{ outline:1.5px solid var(--vermilion); }
.card-row{
  cursor:pointer; padding:10px 12px; display:flex; gap:10px; align-items:flex-start;
  -webkit-tap-highlight-color:transparent;
}
.check-btn{
  flex:0 0 auto; width:23px; height:23px; margin-top:1px; border-radius:50%;
  border:2px solid var(--ink-soft); background:transparent; color:transparent;
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900;
  cursor:pointer; padding:0; transition:.15s;
}
.check-btn:active{ transform:scale(.88); }
.stop.done .check-btn{ background:var(--moss); border-color:var(--moss); color:#fff; }

.card-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;}
.next-flag{font-size:10px; font-weight:800; color:var(--vermilion);}
.row-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.time{
  font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:12px; font-weight:700;
  color:var(--ink-soft); white-space:nowrap;
}
.chip{

.chip.cat-관광,.chip.cat-야경{background:var(--moss-soft); color:var(--moss);}
.chip.cat-쇼핑,.chip.cat-오락,.chip.cat-시장{background:var(--indigo-soft); color:var(--indigo);}
.chip.cat-카페,.chip.cat-휴식,.chip.cat-숙소{background:var(--gold-soft); color:var(--gold);}
.row-mid{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
.stop-title{font-size:14.5px; font-weight:700;}
.stop-summary{font-size:11.5px; color:var(--ink-soft); line-height:1.4;}
.cost{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}
.reserve-flag{font-size:10px; font-weight:800; color:var(--vermilion);}
.chevron{flex:0 0 auto; font-size:10px; color:var(--ink-soft); margin-top:4px; transition:transform .15s;}
.card.open .chevron{transform:rotate(180deg);}

.card-body{display:none; padding:0 12px 12px 45px; font-size:12px; color:var(--ink-soft); line-height:1.6; border-top:1px dashed var(--line); margin-top:2px; padding-top:8px; font-family:var(--font-mono);}
.card.open .card-body{display:block;}

/* completed state: shrink + mute */
.stop.done{ opacity:.5; }
.stop.done .card{ box-shadow:none; }
.stop.done .card-row{ padding:6px 12px; align-items:center; }
.stop.done .card-main{ flex-direction:row; align-items:baseline; gap:8px; }
.stop.done .stop-title{ font-size:12.5px; font-weight:500; text-decoration:line-through; }
.stop.done .chip, .stop.done .cost, .stop.done .reserve-flag, .stop.done .chevron, .stop.done .stop-summary{ display:none; }
.stop.done .card-body{ display:none !important; }

/* overview tab */
.ov-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:16px;}
.ov-table th{
  text-align:left; font-size:10.5px; letter-spacing:.03em; color:var(--ink-soft);
  padding:6px 8px; border-bottom:1px solid var(--line);
}
.ov-table td{padding:8px; border-bottom:1px solid var(--line); vertical-align:top;}
.ov-table tr:last-child td{border-bottom:none;}
.ov-day{font-weight:800; font-family:var(--font-mono);}
.info-card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:14px; box-shadow:var(--shadow);
}
.info-card h3{margin:0 0 8px; font-size:13.5px; font-weight:800;}
.info-card p{margin:0 0 4px; font-size:12.5px; line-height:1.6; color:var(--ink-soft);}

.principle-list{margin:0; padding-left:0; list-style:none; font-size:12.5px; color:var(--ink-soft); display:flex; flex-direction:column; gap:5px;}
.principle-list li{padding-left:14px; position:relative;}
.principle-list li::before{content:"·"; position:absolute; left:0; font-weight:900; color:var(--indigo);}

/* reservation tab */
.res-item{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:8px;

}

}

.res-status.pending{background:var(--vermilion-soft); color:var(--vermilion);}

.placeholder{

  border:1.5px dashed var(--line); border-radius:var(--radius); background:var(--paper-raised);
}

.home-eyebrow{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
}

}

}
.home-title{font-size:21px; font-weight:800; line-height:1.25; margin:5px 0 6px; text-wrap:balance;}
.home-intro{font-size:13px; color:var(--ink-soft); line-height:1.5; margin:0 0 12px;}
.home-reserve{

}

.home-meta-box .reserve-line{color:var(--vermilion); font-weight:700;}
.home-alt{font-size:11.5px; color:var(--ink-soft); font-style:italic;}
.home-more{margin-bottom:12px;}

  -webkit-tap-highlight-color:transparent;
}

.home-more .home-list{margin-top:8px;}
.home-check-btn{
  width:100%; border:none; border-radius:14px; background:var(--moss); color:#fff;
  font-family:var(--font-ui); font-size:15.5px; font-weight:800; padding:14px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px; transition:transform .1s;
  margin-top:4px;
}
.home-check-btn:active{transform:scale(.98);}
.home-status{
  display:flex; align-items:center; justify-content:center; gap:6px; margin-top:10px;
  font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono); font-variant-numeric:tabular-nums;
}

.home-status.early{color:var(--gold);}
.home-progress{font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:2px;}

  display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:12px;
  background:var(--paper-raised); border:1px dashed var(--line); margin-bottom:12px;
}

.home-empty{

  border:1.5px dashed var(--line); border-radius:var(--radius); background:var(--paper-raised);
}

footer.legend{
  padding:10px 16px 6px; font-size:10.5px; color:var(--ink-soft); display:flex; gap:12px; flex-wrap:wrap;
}

/* ---------- home tab ---------- */
function scheduledStart(stop, dateStr){
  const m = stop.t.match(/^(\d{1,2}):(\d{2})/);
  if(!m) return null;
  return new Date(`${dateStr}T${m[1].padStart(2,"0")}:${m[2]}:00+09:00`);
}
const DAY_ORDER = ["1일차","2일차","3일차","4일차"];
/* nearest schedule item = earliest day, earliest unchecked stop. checks always decide
   which item is "next" so a running-late or ran-ahead trip never desyncs from the clock. */
function findNearest(){
  for(const key of DAY_ORDER){
    const day = DATA.days[key];
    if(!day.stops) continue;
    ensureDay(key, day.stops.length);
    const idx = nextIndex(key);
    if(idx !== -1) return {key, day, idx};
  }
  return null;
}
function findAfter(key, idx){
  const day = DATA.days[key];
  if(idx+1 < day.stops.length) return {key, stop:day.stops[idx+1]};
  const pos = DAY_ORDER.indexOf(key);
  for(let p=pos+1; p<DAY_ORDER.length; p++){
    const k = DAY_ORDER[p], d = DATA.days[k];
    if(d.stops && d.stops.length) return {key:k, stop:d.stops[0]};
  }
  return null;
}

      ${overflow.length ? `<details class="home-more">
        <summary>세부 정보 더 보기</summary>

      </details>` : ""}

      <button class="home-check-btn" data-role="home-check" data-day="${esc(key)}" data-idx="${ni}">✓ 완료 체크</button>

function renderOverview(){
  const rows = DATA.overview.days.map(d => `
    <tr>
      <td class="ov-day">${esc(d.d)}</td>
      <td><b>${esc(d.theme)}</b><br><span style="color:var(--ink-soft)">${esc(d.route)}</span></td>
      <td>${esc(d.food)}</td>
      <td>${esc(d.status)}</td>
    </tr>`).join("");
  return `
    <div class="info-card">
      <h3>여행 한눈에 보기</h3>
      <div style="overflow-x:auto">
      <table class="ov-table">
        <thead><tr><th>일차</th><th>핵심 일정</th><th>대표 음식</th><th>상태</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
    </div>
    <div class="info-card">
      <h3>운영 원칙</h3>
      <ul class="principle-list">${DATA.overview.principles.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
    </div>

      <h3>항공 · 숙소</h3>
      <p><b>가는 편</b> ${esc(DATA.overview.flight.out)}</p>

function renderReservations(){
  const items = DATA.reservations.map(r => `
    <div class="res-item">
      <div class="res-main">
        <div class="res-name">${esc(r.name)}</div>
        <div class="res-meta">${esc(r.meta)}</div>

    ${items}`;

let activeTab = "1일차";

/* --- checklist state (persisted per-browser) --- */
const DONE_KEY = "osaka_guide_done_v2";
function loadDone(){
  try{ return JSON.parse(localStorage.getItem(DONE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveDone(){
  try{ localStorage.setItem(DONE_KEY, JSON.stringify(doneState)); }catch(e){}
}
const doneState = loadDone();
function ensureDay(key, len){
  if(!Array.isArray(doneState[key]) || doneState[key].length!==len){
    doneState[key] = new Array(len).fill(false);
  }
}
function nextIndex(key){
  const arr = doneState[key] || [];
  for(let i=0;i<arr.length;i++) if(!arr[i]) return i;
  return -1;
}
/* runtime-only manual expand overrides (not persisted) */
const manualToggle = new Set();

function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = tabDefs.map(t => `<button data-key="${t.key}" class="${t.key===activeTab?'active':''}">${t.label}</button>`).join("");
  nav.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{ activeTab = btn.dataset.key; render(); });
  });
}

function updatePill(){
  const pill = document.getElementById("nowPill");
  // home tab already shows full detail + status inline; avoid duplicating it in the header
  if(activeTab === "home" || activeTab === "overview" || activeTab === "reservations"){
    pill.style.display = "none"; return;
  }
  const day = DATA.days[activeTab];
  if(!day || !day.stops){ pill.style.display = "none"; return; }
  const ni = nextIndex(activeTab);
  if(ni === -1){
    pill.textContent = `${activeTab} 완료 🎉`;
  } else {
    pill.textContent = `다음 · ${DATA.days[activeTab].stops[ni].t} ${DATA.days[activeTab].stops[ni].title}`;
  }
  pill.style.display = "inline-block";
}

function render(){
  renderTabs();
  const main = document.getElementById("main");
  if(activeTab === "home") main.innerHTML = renderHome();
  else if(activeTab === "overview") main.innerHTML = renderOverview();
  else if(activeTab === "reservations") main.innerHTML = renderReservations();
  else main.innerHTML = renderDayPanel(activeTab, DATA.days[activeTab]);
  updatePill();
  bindPanelEvents();
}

function bindPanelEvents(){
  document.querySelectorAll('[data-role="check"]').forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const day = btn.dataset.day, idx = +btn.dataset.idx;
      ensureDay(day, DATA.days[day].stops.length);
      doneState[day][idx] = !doneState[day][idx];
      manualToggle.delete(day+"-"+idx);
      saveDone();
      render();
      requestAnimationFrame(()=>{
        setTimeout(()=>{
          const el = document.querySelector(".stop.next");
          if(el) el.scrollIntoView({block:"center", behavior:"smooth"});
        }, 60);
      });
    });
  });
  document.querySelectorAll('[data-role="home-check"]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const day = btn.dataset.day, idx = +btn.dataset.idx;
      ensureDay(day, DATA.days[day].stops.length);
      doneState[day][idx] = true;
      saveDone();
      render();
    });
  });
  document.querySelectorAll('[data-role="toggle"]').forEach(row=>{
    row.addEventListener("click", ()=>{
      const day = row.dataset.day, idx = +row.dataset.idx;
      if(doneState[day] && doneState[day][idx]) return;
      const id = day+"-"+idx;
      if(manualToggle.has(id)) manualToggle.delete(id); else manualToggle.add(id);
      render();
    });
  });
  document.querySelectorAll('[data-role="reset"]').forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const day = btn.dataset.day;
      if(!confirm(`${day} 체크 표시를 모두 초기화할까요?`)) return;
      ensureDay(day, DATA.days[day].stops.length);
      doneState[day] = doneState[day].map(()=>false);
      saveDone();
      render();
    });
  });
}

/* fullscreen toggle: hides the browser address bar entirely on browsers that support it */
function bindFullscreenBtn(){
  const btn = document.getElementById("fsBtn");
  const el = document.documentElement;
  const canFullscreen = !!(el.requestFullscreen || el.webkitRequestFullscreen);
  if(!canFullscreen){ btn.style.display = "none"; return; }
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const syncIcon = () => { btn.textContent = isFs() ? "⤢" : "⛶"; };
  btn.addEventListener("click", () => {
    if(!isFs()){
      (el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen());
    } else {
      (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
    }
  });
  document.addEventListener("fullscreenchange", syncIcon);
  document.addEventListener("webkitfullscreenchange", syncIcon);

  /* browsers won't allow auto-fullscreen on load without a user gesture,
     so ride the very first tap on the page (whatever it's for) into fullscreen */
  const autoEnter = () => {
    if(!isFs()){
      const req = el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen();
      if(req && req.catch) req.catch(()=>{});
    }
    document.removeEventListener("click", autoEnter);
  };
  document.addEventListener("click", autoEnter, {once:true});
}

document.addEventListener("DOMContentLoaded", () => {
  activeTab = "home";
  render();
  /* Manual fullscreen is removed in the standalone PWA UI. */
});

<script type="text/plain" data-legacy-pwa-renderer>
(function(){
  const PWA_KEY="osaka_guide_pwa_state_v1";
  let pwaState={}; try{pwaState=JSON.parse(localStorage.getItem(PWA_KEY)||"{}")}catch(e){}
  let pwaUi={tab:"home",day:"1일차",index:0};
  const pwaEsc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const pwaId=(day,i)=>day+"-"+i;
  const pwaGet=(day,i)=>pwaState[pwaId(day,i)]||((doneState[day]||[])[i]?"done":"active");
  const pwaSave=(day,i,status)=>{pwaState[pwaId(day,i)]=status;localStorage.setItem(PWA_KEY,JSON.stringify(pwaState));pwaRender()};
  const pwaPrepGet=i=>pwaState["prep-"+i]==="done";
  const pwaPrepSave=i=>{pwaState["prep-"+i]=pwaPrepGet(i)?"active":"done";localStorage.setItem(PWA_KEY,JSON.stringify(pwaState));pwaRender()};
  const pwaStart=(stop,date)=>{const m=String(stop.t).match(/^(\d{1,2}):(\d{2})/);return m?new Date(date+"T"+m[1].padStart(2,"0")+":"+m[2]+":00+09:00"):null};
  const pwaFirstActive=()=>{for(const day of ["1일차","2일차"]){const d=DATA.days[day];if(!d.stops)continue;const i=d.stops.findIndex((_,n)=>pwaGet(day,n)==="active");if(i>=0)return{day,d,index:i}}return null};
  const pwaHomeTarget=()=>{const found=pwaFirstActive();return found||null};
  const pwaTimeTarget=()=>{let best=null,bestAbs=Infinity,now=Date.now();for(const day of ["1일차","2일차"]){const d=DATA.days[day];if(!d.stops)continue;d.stops.forEach((s,i)=>{if(pwaGet(day,i)!=="active")return;const start=pwaStart(s,d.date);if(!start)return;const diff=Math.abs(now-start.getTime());if(diff<bestAbs){bestAbs=diff;best={day,d,index:i}}})}return best};
  function pwaHead(title,sub){return '<h2 class="pwa-title">'+title+'</h2><p class="pwa-subtitle">'+sub+"</p>"}
  function pwaMapButtons(mismatch){return '<div class="pwa-actions">'+(mismatch?'<button class="pwa-button primary" data-pwa-time>시간 일정</button>':"")+'<button class="pwa-button" disabled title="지도 데이터 입력 예정">길찾기</button><button class="pwa-button" disabled title="지도 데이터 입력 예정">장소 보기</button></div>'}
  function pwaHome(){
    const f=pwaHomeTarget();if(!f)return pwaHead("홈","전체 일정 확인")+"<div class=\"pwa-plan\"><b>현재 일정이 없습니다.</b><br>완료한 일정은 일정 탭에서 다시 확인할 수 있습니다.</div>";
    const s=f.d.stops[f.index],d=s.detail,start=pwaStart(s,f.d.date),diff=start?Math.round((Date.now()-start.getTime())/60000):0,mismatch=Math.abs(diff)>30;
    const next=f.d.stops[f.index+1];
    return pwaHead("홈","오사카 3박4일 · 2026.08.09–08.12")+
      '<div class="pwa-eyebrow"><span>현재 확인할 일정</span><span class="pwa-daytag">'+pwaEsc(f.day)+" · "+pwaEsc(f.d.theme)+"</span></div>"+
      '<article class="pwa-card"><div class="pwa-topline"><span class="pwa-time">'+pwaEsc(s.t)+'</span><span class="pwa-type">● '+pwaEsc(s.cat)+'</span></div><h2>'+pwaEsc(s.title)+'</h2><p class="pwa-intro">'+pwaEsc(d.intro)+'</p>'+
      (mismatch?'<div class="pwa-notice"><span>◷</span><span><b>시간이 일정과 크게 다릅니다.</b><br>자동으로 완료하거나 건너뛰지 않습니다.</span></div>':"")+
      pwaMapButtons(mismatch)+
      (d.primary.length?'<div class="pwa-section"><div class="pwa-label">지금 할 일</div><ul class="pwa-list">'+d.primary.map(x=>"<li>"+pwaEsc(x)+"</li>").join("")+"</ul></div>":"")+
      (d.recommendation.length?'<div class="pwa-section"><div class="pwa-label">추천</div><ul class="pwa-list">'+d.recommendation.map(x=>"<li>"+pwaEsc(x)+"</li>").join("")+"</ul></div>":"")+
      (d.info.length?'<div class="pwa-section"><div class="pwa-label">이동 · 현장 정보</div><div class="pwa-box">'+d.info.map(pwaEsc).join("<br>")+"</div></div>":"")+
      '<div class="pwa-section"><div class="pwa-label">비용 · 주의 · 대체안</div><div class="pwa-box"><b>'+pwaEsc(d.costLine||s.cost)+"</b>"+(d.reserveNote?"<br>⚠ "+pwaEsc(d.reserveNote):"")+(d.alternative?"<br>대체안 · "+pwaEsc(d.alternative):"")+"</div></div>"+
      (next?'<div class="pwa-next"><span>다음 일정</span><b>'+pwaEsc(next.t)+" "+pwaEsc(next.title)+"</b></div>":"")+

    else body='<div class="pwa-timeline">'+d.stops.map((s,i)=>{const st=pwaGet(pwaUi.day,i);return '<div class="pwa-stop '+st+'"><div class="pwa-stop-card"><div class="pwa-stop-row"><button class="pwa-check" data-pwa-check="'+i+'">'+(st==="done"?"✓":st==="skipped"?"↷":"")+'</button><div class="pwa-stop-main"><span class="pwa-chip">'+pwaEsc(s.cat)+'</span><span class="pwa-time">'+pwaEsc(s.t)+'</span><div class="pwa-stop-title">'+pwaEsc(s.title)+'</div><div class="pwa-stop-summary">'+pwaEsc(s.compact.summary)+"</div></div></div></div></div>"}).join("")+"</div>";
    return pwaHead("일정","일차별 전체 타임라인")+'<div class="pwa-day-switch">'+["1일차","2일차","3일차","4일차"].map(k=>'<button class="'+(k===pwaUi.day?"active":"")+'" data-pwa-day="'+k+'">'+k+"</button>").join("")+"</div>"+body;
  }
  function pwaPrep(){
    return pwaHead("준비","예약 · 티켓 · 현장 판단 기준")+'<div class="pwa-prep pwa-summary"><b>여행 한눈에 보기</b><p>1일차 · 난바·닛폰바시 적응<br>2일차 · 오사카성·텐마·우메다<br>3일차 · 계획 중<br>4일차 · 귀국일</p></div>'+
      DATA.reservations.map((r,i)=>{const done=pwaPrepGet(i);return '<div class="pwa-prep '+(done?"done":"")+'"><div class="pwa-prep-row"><button class="pwa-prep-check" data-pwa-prep="'+i+'">'+(done?"✓":"")+'</button><div><b>'+pwaEsc(r.name)+'</b><p>'+pwaEsc(r.meta)+"</p></div></div></div>"}).join("")+
      '<div class="pwa-prep"><b>현장 판단 기준</b><p>'+DATA.judgeCriteria.map(pwaEsc).join("<br>")+"</p></div>";
  }
  function pwaRender(){
    document.querySelector(".app, .pwa-app").outerHTML='<div class="pwa-app"><header class="pwa-header"><h1>오사카 3박4일</h1><p class="pwa-sub">PWA standalone · 성인 2명 · Hotel ASIATO Namba</p></header><main class="pwa-main">'+(pwaUi.tab==="home"?pwaHome():pwaUi.tab==="schedule"?pwaSchedule():pwaPrep())+'</main><nav class="pwa-bottom"><button data-pwa-tab="home" class="'+(pwaUi.tab==="home"?"active":"")+'"><span class="icon">⌂</span>홈</button><button data-pwa-tab="schedule" class="'+(pwaUi.tab==="schedule"?"active":"")+'"><span class="icon">▤</span>일정</button><button data-pwa-tab="prep" class="'+(pwaUi.tab==="prep"?"active":"")+'"><span class="icon">✓</span>준비</button></nav></div>';
    document.querySelectorAll("[data-pwa-tab]").forEach(b=>b.onclick=()=>{pwaUi.tab=b.dataset.pwaTab;pwaRender()});
    document.querySelectorAll("[data-pwa-day]").forEach(b=>b.onclick=()=>{pwaUi.day=b.dataset.pwaDay;pwaUi.index=0;pwaRender()});
    document.querySelectorAll("[data-pwa-check]").forEach(b=>b.onclick=()=>{const i=+b.dataset.pwaCheck,st=pwaGet(pwaUi.day,i);pwaSave(pwaUi.day,i,st==="done"?"active":"done")});
    document.querySelectorAll("[data-pwa-prep]").forEach(b=>b.onclick=()=>pwaPrepSave(+b.dataset.pwaPrep));
    document.querySelectorAll("[data-pwa-state]").forEach(b=>b.onclick=()=>{const f=pwaHomeTarget();if(f)pwaSave(f.day,f.index,b.dataset.pwaState)});
    document.querySelectorAll("[data-pwa-time]").forEach(b=>b.onclick=()=>{const f=pwaTimeTarget();if(f){pwaUi.day=f.day;pwaUi.index=f.index}pwaRender()});
  }

<script type="text/plain" data-legacy-undo-enhancer>
(()=>{const stateKey="osaka_guide_final_state_v1",dayForToday=()=>{const days=Object.keys(window.TRAVEL_GUIDE?.days||{}),now=new Date(),start=new Date(2026,7,9);now.setHours(0,0,0,0);start.setHours(0,0,0,0);return days[Math.max(0,Math.min(days.length-1,Math.floor((now-start)/86400000)))];};const enhance=()=>{const home=document.querySelector('[data-tab="home"].active'),card=document.querySelector(".pwa-main .pwa-card");if(!home||!card)return;card.querySelector(".guide-undo-home")?.remove();const day=dayForToday(),days=window.TRAVEL_GUIDE?.days,raw=localStorage.getItem(stateKey),state=JSON.parse(raw||"{}");if(!days?.[day])return;const current=days[day].stops.findIndex((_,i)=>(state[`${day}-${i}`]||"active")==="active");if(current<=0)return;let previous=-1;for(let i=current-1;i>=0;i--){if(state[`${day}-${i}`]==="done"){previous=i;break}}if(previous<0)return;const b=document.createElement("button");b.className="guide-undo-home";b.dataset.undoHome=`${day}|${previous}`;b.title="이전 일정으로 복원";b.setAttribute("aria-label","이전 일정으로 복원");b.textContent="↶";card.appendChild(b)};const observer=new MutationObserver(()=>enhance());observer.observe(document.body,{childList:true,subtree:true});document.addEventListener("click",e=>{const b=e.target.closest("[data-undo-home]");if(!b)return;const [d,i]=b.dataset.undoHome.split("|");const state=JSON.parse(localStorage.getItem(stateKey)||"{}");state[`${d}-${i}`]="active";localStorage.setItem(stateKey,JSON.stringify(state));document.querySelector('[data-tab="home"]')?.click()});document.addEventListener("DOMContentLoaded",()=>setTimeout(enhance,250))})();
</script>
<style>
.guide-check-section{margin:0 0 10px;border:1px solid #dce4ef;border-radius:18px;background:#fff;overflow:hidden}.guide-check-head{display:block;width:100%;padding:14px;border:0;background:#fff;text-align:left;font:inherit}.guide-check-top{display:flex;justify-content:space-between;gap:8px}.guide-check-title{font-size:16px;font-weight:900}.guide-check-count{color:#1667d9;font-size:12px;font-weight:800}.guide-check-bar{height:5px;margin-top:9px;border-radius:9px;background:#edf1f6;overflow:hidden}.guide-check-bar i{display:block;height:100%;background:#1667d9}.guide-check-items{padding:0 10px 10px}.guide-check-group{margin:15px 2px 7px;color:#526074;font-size:12px;font-weight:900}.guide-check-item{display:flex;align-items:flex-start;gap:9px;min-height:56px;padding:10px 6px;border-top:1px solid #edf1f6;cursor:pointer}.guide-check-item.done{min-height:42px;align-items:center;padding:7px 6px;border-radius:10px;background:#f0faf5}.guide-check-mark{display:grid;place-items:center;flex:0 0 26px;height:26px;border:2px solid #b8c5d5;border-radius:50%;color:transparent;font-weight:900}.guide-check-item.done .guide-check-mark{border-color:#198754;background:#198754;color:#fff}.guide-check-main{min-width:0}.guide-check-name{font-size:13px;font-weight:800;line-height:1.4}.guide-check-note{display:block;margin-top:3px;color:#667085;font-size:11px;line-height:1.4}.guide-check-item.done .guide-check-note{display:none}.guide-check-item.done .guide-check-main:after{content:"완료";margin-left:7px;color:#198754;font-size:10px;font-weight:800}.guide-check-alt{margin:18px 0 9px;padding:13px;border:1px solid #dce4ef;border-radius:16px;background:#fff}.guide-check-alt h3{margin:0 0 5px;font-size:14px}.guide-check-alt p{margin:0;color:#667085;font-size:12px;line-height:1.45}.guide-check-alt .pwa-actions{margin-top:9px;grid-template-columns:repeat(2,minmax(0,1fr))}
</style>
<script>

 const alt=[{n:"우오야 히데조 별관 — 魚屋ひでぞう 別館",d:"2일차 밤 현장 확인 1순위",s:"https://www.google.com/maps/search/?api=1&query=%E9%AD%9A%E5%B1%8B%E3%81%B2%E3%81%A7%E3%81%9E%E3%81%86%20%E5%88%A5%E9%A4%A8%20%E5%A4%A7%E9%98%AA",r:"https://www.google.com/maps/dir/?api=1&destination=%E9%AD%9A%E5%B1%8B%E3%81%B2%E3%81%A7%E3%81%9E%E3%81%86%20%E5%88%A5%E9%A4%A8%20%E5%A4%A7%E9%98%AA"},{n:"숯불 야키토리 토코하 난바점 — 炭火焼鳥 とこ葉 なんば店",d:"히데조 만석 시 2순위",s:"https://www.google.com/maps/search/?api=1&query=%E7%82%AD%E7%81%AB%E7%84%BC%E9%B3%A5%20%E3%81%A8%E3%81%93%E8%91%89%20%E3%81%AA%E3%82%93%E3%81%B0%E5%BA%97",r:"https://www.google.com/maps/dir/?api=1&destination=%E7%82%AD%E7%81%AB%E7%84%BC%E9%B3%A5%20%E3%81%A8%E3%81%93%E8%91%89%20%E3%81%AA%E3%82%93%E3%81%B0%E5%BA%97"},{n:"생선관 구로몬 나카가와 — 生鮮館 黒門中川",d:"외식이 어려울 때 숙소 야식 대안",s:"https://www.google.com/maps/search/?api=1&query=%E7%94%9F%E9%AE%AE%E9%A4%A8%20%E9%BB%92%E9%96%80%E4%B8%AD%E5%B7%9D%20%E5%A4%A7%E9%98%AA",r:"https://www.google.com/maps/dir/?api=1&destination=%E7%94%9F%E9%AE%AE%E9%A4%A8%20%E9%BB%92%E9%96%80%E4%B8%AD%E5%B7%9D%20%E5%A4%A7%E9%98%AA"},{n:"기요미즈데라 특별내진",d:"더위·혼잡·체력에 따라 선택"},{n:"츠텐카쿠 전망대 · HEP FIVE",d:"대기·시간·체력이 남을 때 선택"}];
 const id=(s,g,i)=>`p-${s}-${g}-${i}`,count=(s,si)=>{const rows=s.groups.flatMap((g,gi)=>g[1].map((_,i)=>id(si,gi,i)));return [rows.filter(k=>saved[k]).length,rows.length]},esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
 const item=(si,gi,i,r)=>{const k=id(si,gi,i),d=!!saved[k];return `<div class="guide-check-item ${d?"done":""}" data-guide-check="${k}"><span class="guide-check-mark">${d?"✓":""}</span><span class="guide-check-main"><span class="guide-check-name">${esc(Array.isArray(r)?r[0]:r)}</span>${Array.isArray(r)&&r[1]?`<span class="guide-check-note">${esc(r[1])}</span>`:""}</span></div>`};
 const section=(s,si)=>{const [ok,total]=count(s,si);return `<section class="guide-check-section"><button class="guide-check-head" data-guide-section="${si}"><span class="guide-check-top"><span class="guide-check-title">${s.name}</span><span class="guide-check-count">${ok}개 중 ${total}개 완료</span></span><span class="guide-check-bar"><i style="width:${total?ok/total*100:0}%"></i></span></button>${open[si]?`<div class="guide-check-items">${s.groups.map((g,gi)=>`<div class="guide-check-group">${g[0]}</div>${g[1].map((r,i)=>item(si,gi,i,r)).join("")}`).join("")}</div>`:""}</section>`};
 const render=()=>{if(!visible)return;const order=C.map((s,i)=>[s,i]).sort((a,b)=>{const x=count(a[0],a[1]),y=count(b[0],b[1]);return Number(x[0]===x[1])-Number(y[0]===y[1])});const root=document.querySelector(".pwa-main");if(!root)return;root.innerHTML=`<h2 class="pwa-title">준비</h2><p class="pwa-subtitle">출국 전·일본 입국 시·귀국 전 체크리스트</p>${order.map(([s,i])=>section(s,i)).join("")}<h3 class="guide-alt-group">현장 대안·알아두면 좋은 장소</h3>${alt.map(a=>`<article class="guide-check-alt"><h3>${a.n}</h3><p>${a.d}</p>${a.s?`<div class="pwa-actions"><button class="pwa-button place" data-guide-url="${a.s}">정보 보기</button><button class="pwa-button route" data-guide-url="${a.r}">길찾기</button></div>`:""}</article>`).join("")}`};
 document.addEventListener("click",e=>{const tab=e.target.closest("[data-tab]");if(tab){visible=tab.dataset.tab==="prep";if(visible)setTimeout(render,0);return}const c=e.target.closest("[data-guide-check]");if(c){saved[c.dataset.guideCheck]=!saved[c.dataset.guideCheck];localStorage.setItem(store,JSON.stringify(saved));render();return}const sec=e.target.closest("[data-guide-section]");if(sec){open[+sec.dataset.guideSection]=!open[+sec.dataset.guideSection];render();return}const link=e.target.closest("[data-guide-url]");if(link){const browser=window.Capacitor?.Plugins?.Browser;if(browser?.open)browser.open({url:link.dataset.guideUrl});else window.open(link.dataset.guideUrl,"_blank","noopener,noreferrer")}});document.addEventListener("DOMContentLoaded",()=>setTimeout(()=>{visible=!!document.querySelector('[data-tab="prep"].active');if(visible)render()},50))})();
